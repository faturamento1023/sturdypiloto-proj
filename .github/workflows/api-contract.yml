name: Validate API contract
on:
  pull_request:
    paths:
      - 'openapi/**'
      - 'scripts/validate-dev010.py'
      - '.node-version'
      - '.github/workflows/api-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Lint OpenAPI
        run: npx --yes --package=@redocly/cli@2.76.0 redocly lint openapi/dev010.yaml --extends recommended --skip-rule info-license
      - name: Check contract examples and rejected inputs
        run: |
          python -m pip install PyYAML==6.0.3 'jsonschema[format]==4.26.0'
          python scripts/validate-dev010.py
