name: DEV-019 — Preços e convênios
on:
  pull_request:
    paths:
      - 'scripts/dev019_precos*.cjs'
      - '.github/workflows/dev019-prices.yml'
  workflow_dispatch:
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar regras de preços com dados sintéticos
        run: node --test scripts/dev019_precos.test.cjs
