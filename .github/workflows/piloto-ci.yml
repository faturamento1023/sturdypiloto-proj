name: Piloto CI e homologacao
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: piloto-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verificar:
    name: Build, banco e navegador
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: piloto_teste
          POSTGRES_PASSWORD: piloto_descartavel
          POSTGRES_DB: piloto_reservas_teste
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U piloto_teste -d piloto_reservas_teste"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run test:database
      - name: Disputar reservas em duas sessões PostgreSQL
        env:
          PGPORT: ${{ job.services.postgres.ports[5432] }}
          PGPASSWORD: piloto_descartavel
        run: |
          if ! command -v psql >/dev/null; then sudo apt-get update && sudo apt-get install -y postgresql-client; fi
          bash scripts/testar-reservas-concorrentes.sh
      - run: npm run test:authorization
      - run: node --test src/agenda/*.test.ts src/cadastros/*.test.mjs scripts/dev019_precos.test.cjs scripts/dev019_migracao.test.cjs
      - run: npm run build
      - run: npm run prepare:homologacao
      - run: npm run test:e2e
        env:
          PILOTO_E2E_CHROME: '1'
      - name: Empacotar versão sintética
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p artifacts
          tar --exclude='.env*' --exclude='*/.env*' -czf artifacts/piloto.tar.gz -C .next/standalone .
          (cd artifacts && sha256sum piloto.tar.gz > piloto.tar.gz.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: piloto-homologacao-${{ github.sha }}
          path: artifacts/piloto.tar.gz*
          if-no-files-found: error
          retention-days: 7

  homologacao:
    name: Executar artefato de homologacao
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: homologacao
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: piloto-homologacao-${{ github.sha }}
          path: pacote
      - name: Validar integridade e iniciar o artefato
        shell: bash
        run: |
          cd pacote
          sha256sum --check piloto.tar.gz.sha256
          mkdir app
          tar -xzf piloto.tar.gz -C app
          PILOTO_AMBIENTE=homologacao HOSTNAME=127.0.0.1 PORT=3100 node app/server.js > servidor.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          if ! curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-connrefused --max-time 4 http://127.0.0.1:3100/api/saude > saude.json; then
            cat servidor.log
            exit 1
          fi
          node -e 'require("node:assert/strict").deepEqual(require("./saude.json"), {status:"ok", ambiente:"homologacao"})'
          curl --fail --silent --show-error http://127.0.0.1:3100/ > pagina.html
          grep -q 'Projeto Piloto' pagina.html
