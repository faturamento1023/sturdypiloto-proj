name: Prototype domain tests
on:
  pull_request:
    paths:
      - 'prototype/contracts/**'
      - '.github/workflows/prototype-domain-tests.yml'
  workflow_dispatch:
jobs:
  test-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Run isolated domain tests (synthetic data only)
        run: node --test prototype/contracts/domain.test.ts
