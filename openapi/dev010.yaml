openapi: 3.1.0
info:
  title: Projeto Piloto · API Clínica DM
  version: 0.4.0
  description: Contratos da DEV-010, acesso da DEV-013 e grade da DEV-021. Exemplos inteiramente fictícios.
servers:
- url: /api/v1
  description: Prefixo relativo ao ambiente autorizado.
security:
- SessaoBearer: []
tags:
- name: Acesso
  description: Perfis ativos da própria sessão por unidade.
- name: Agenda
  description: Reservas de horário e remarcações.
- name: Pacientes
  description: Identificação e busca de pacientes por unidade.
- name: Atendimentos
  description: Abertura de atendimento e registro de itens.
- name: Catálogo
  description: Consulta de procedimentos e vigências de preços.
- name: Prontuário e laudos
  description: Rascunhos e versões no escopo médico.
- name: Financeiro
  description: Saldo, recebimentos e estornos registrados.
paths:
  /unidades/{unidadeId}/acesso:
    parameters:
    - $ref: '#/components/parameters/UnidadeId'
    get:
      operationId: consultarMeuAcesso
      tags: [Acesso]
      summary: Consultar os próprios perfis ativos na unidade
      description: Requer sessão com MFA e retorna somente vínculos ativos da conta em uma unidade ativa.
      security:
      - SessaoCookie: []
      x-perfis: [recepcao, medico, financeiro, gestao, administrador]
      responses:
        '200':
          description: Perfis ativos da sessão para a unidade.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcessoUnidade'
              example:
                unidadeId: 00000000-0000-4000-8000-000000000001
                perfis: [recepcao]
        '400':
          $ref: '#/components/responses/EntradaInvalida'
        '401':
          description: Sessão por cookie ausente ou inválida.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              example:
                type: about:blank
                title: Autenticação necessária
                status: 401
                codigo: SESSAO_INVALIDA
                correlacaoId: 00000000-0000-4000-8000-000000000099
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '503':
          description: Provedor de autorização temporariamente indisponível.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              example:
                type: about:blank
                title: Autorização temporariamente indisponível
                status: 503
                codigo: AUTORIZACAO_INDISPONIVEL
                correlacaoId: 00000000-0000-4000-8000-000000000099
  /unidades/{unidadeId}/agenda:
    parameters:
    - $ref: '#/components/parameters/UnidadeId'
    get:
      operationId: listarAgenda
      tags:
      - Agenda
      summary: Consultar a grade de agenda
      security:
      - SessaoCookie: []
      description: >
        Retorna a grade completa da janela no escopo da sessão, sem dados de paciente.
        Médico recebe a própria agenda. Compromissos são recortados nas fronteiras,
        ordenados por início e ID e incluem cancelamentos. Horários livres vêm de
        janelas explícitas e disponibilidades semanais, descontando compromissos que não foram cancelados.
        A disponibilidade semanal inclui o nome do local. Feriados fecham o dia,
        horários substitutos trocam as janelas do profissional e bloqueios
        descontam intervalos. O campo opcional avisos informa as exceções visíveis.
        Se a capacidade for excedida, reduza a janela ou filtre por profissional.
      x-perfis:
      - recepcao
      - gestao
      - administrador
      - medico
      parameters:
      - $ref: '#/components/parameters/Inicio'
      - $ref: '#/components/parameters/Fim'
      - $ref: '#/components/parameters/ProfissionalFiltro'
      responses:
        '200':
          description: Grade no escopo da sessão. A resposta usa Cache-Control private, no-store.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeAgenda'
              example:
                profissionais:
                - id: 00000000-0000-4000-8000-000000000021
                  nome: Profissional fictício
                  ativo: true
                agendamentos:
                - id: 00000000-0000-4000-8000-000000000031
                  profissional_id: 00000000-0000-4000-8000-000000000021
                  inicio: '2026-11-05T08:00:00-03:00'
                  fim: '2026-11-05T08:30:00-03:00'
                  estado: reservado
                livres:
                - profissional_id: 00000000-0000-4000-8000-000000000021
                  inicio: '2026-11-05T08:30:00-03:00'
                  fim: '2026-11-05T09:00:00-03:00'
                  local_nome: Sala fictícia
                avisos:
                - tipo: bloqueio
                  inicio: '2026-11-05T09:00:00-03:00'
                  fim: '2026-11-05T10:00:00-03:00'
        '400':
          $ref: '#/components/responses/EntradaInvalida'
        '401':
          $ref: '#/components/responses/AutenticacaoNecessaria'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '422':
          description: Grade excede o limite de 500 registros por categoria de entrada.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              example:
                type: about:blank
                title: Reduza o intervalo ou filtre por profissional
                status: 422
                codigo: GRADE_EXCEDIDA
                correlacaoId: 00000000-0000-4000-8000-000000000099
        '503':
          description: Consulta temporariamente indisponível.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              example:
                type: about:blank
                title: Agenda temporariamente indisponível
                status: 503
                codigo: AGENDA_INDISPONIVEL
                correlacaoId: 00000000-0000-4000-8000-000000000099
  /unidades/{unidadeId}/agendamentos:
    parameters:
    - $ref: '#/components/parameters/UnidadeId'
    post:
      operationId: criarAgendamento
      tags:
      - Agenda
      summary: Reservar horário
      description: Cria uma reserva sem abrir atendimento. Sobreposição retorna 409 AGENDA_CONFLITO. Encaixe exige regra
        posterior.
      x-perfis:
      - recepcao
      - gestao
      parameters:
      - $ref: '#/components/parameters/Idempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarAgendamento'
            example:
              pacienteId: 00000000-0000-4000-8000-000000000011
              profissionalId: 00000000-0000-4000-8000-000000000021
              inicio: '2026-11-05T08:00:00-03:00'
              fim: '2026-11-05T08:30:00-03:00'
      responses:
        '201':
          description: Reserva criada.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agendamento'
              example:
                id: 00000000-0000-4000-8000-000000000031
                pacienteId: 00000000-0000-4000-8000-000000000011
                profissionalId: 00000000-0000-4000-8000-000000000021
                inicio: '2026-11-05T08:00:00-03:00'
                fim: '2026-11-05T08:30:00-03:00'
                estado: reservado
        '400':
          $ref: '#/components/responses/EntradaInvalida'
        '401':
          $ref: '#/components/responses/AutenticacaoNecessaria'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '413':
          $ref: '#/components/responses/CorpoMuitoGrande'
        '415':
          $ref: '#/components/responses/FormatoIncompativel'
        '422':
          $ref: '#/components/responses/RegraNegocio'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /unidades/{unidadeId}/agendamentos/{agendamentoId}:
    parameters:
    - $ref: '#/components/parameters/UnidadeId'
    - $ref: '#/components/parameters/AgendamentoId'
    get:
      operationId: consultarAgendamento
      tags:
      - Agenda
      summary: Consultar agendamento
      description: Devolve os dados do agendamento e a revisão atual. Médico recebe somente agendamentos próprios.
      x-perfis:
      - recepcao
      - gestao
      - administrador
      - medico
      responses:
        '200':
          description: Agendamento encontrado.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agendamento'
              example:
                id: 00000000-0000-4000-8000-000000000031
                pacienteId: 00000000-0000-4000-8000-000000000011
                profissionalId: 00000000-0000-4000-8000-000000000021
                inicio: '2026-11-05T08:00:00-03:00'
                fim: '2026-11-05T08:30:00-03:00'
                estado: reservado
        '400':
          $ref: '#/components/responses/EntradaInvalida'
        '401':
          $ref: '#/components/responses/AutenticacaoNecessaria'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
    patch:
      operationId: alterarAgendamento
      tags:
      - Agenda
      summary: Alterar agendamento
      description: Remarca, confirma ou cancela um agendamento. Alteração de horário ou cancelamento com atendimento
        já aberto fica bloqueada até definição operacional.
      x-perfis:
      - recepcao
      - gestao
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlterarAgendamento'
            example:
              acao: confirmar
      responses:
        '200':
          description: Agendamento alterado.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agendamento'
              example:
                id: 00000000-0000-4000-8000-000000000031
                pacienteId: 00000000-0000-4000-8000-000000000011
                profissionalId: 00000000-0000-4000-8000-000000000021
                inicio: '2026-11-05T08:00:00-03:00'
                fim: '2026-11-05T08:30:00-03:00'
                estado: confirmado
        '400':
          $ref: '#/components/responses/EntradaInvalida'
        '401':
          $ref: '#/components/responses/AutenticacaoNecessaria'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '412':
          $ref: '#/components/responses/VersaoDesatualizada'
        '413':
          $ref: '#/components/responses/CorpoMuitoGrande'
        '415':
          $ref: '#/components/responses/FormatoIncompativel'
        '422':
          $ref: '#/components/responses/RegraNegocio'
        '428':
          $ref: '#/components/responses/VersaoObrigatoria'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /unidades/{unidadeId}/pacientes:
    parameters:
    - $ref: '#/components/parameters/UnidadeId'
    get:
      operationId: buscarPacientes
      tags:
      - Pacientes
      summary: Buscar pacientes
      description: Busca obrigatória com 2 a 80 caracteres. Médico só recebe pacientes vinculados à sua agenda ou atendimento
        no escopo autorizado. Ordenação por nome normalizado e ID crescentes.
      x-perfis:
      - recepcao
      - medico
      parameters:
      - name: q
        in: query
        required: true
        description: Parte do nome, após remoção de espaços nas pontas.
        schema:
          type: string
          minLength: 2
          maxLength: 80
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Página de resultados no escopo da sessão.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaPacienteResumo'
              example:
                dados:
                - id: 00000000-0000-4000-8000-000000000011
                  nome: Paciente Exemplo A
                paginacao:
                  proximoCursor: null
                  limite: 25
        '400':
          $ref: '#/components/responses/EntradaInvalida'
        '401':
          $ref: '#/components/responses/AutenticacaoNecessaria'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
    post:
      operationId: criarPaciente
      tags:
      - Pacientes
      summary: Cadastrar paciente
      description: Registra os dados mínimos do paciente na unidade. A verificação de duplicidade será aplicada na implementação.
      x-perfis:
      - recepcao
      parameters:
      - $ref: '#/components/parameters/Idempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarPaciente'
            example:
              nome: Paciente Exemplo A
              nascimento: '1991-02-03'
      responses:
        '201':
          description: Paciente cadastrado.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacienteDetalhe'
              example:
                id: 00000000-0000-4000-8000-000000000011
                nome: Paciente Exemplo A
                nascimento: '1991-02-03'
        '400':
          $ref: '#/components/responses/EntradaInvalida'
        '401':
          $ref: '#/components/responses/AutenticacaoNecessaria'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '413':
          $ref: '#/components/responses/CorpoMuitoGrande'
        '415':
          $ref: '#/components/responses/FormatoIncompativel'
        '422':
          $ref: '#/components/responses/RegraNegocio'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /unidades/{unidadeId}/pacientes/{pacienteId}:
    parameters:
    - $ref: '#/components/parameters/UnidadeId'
    - $ref: '#/components/parameters/PacienteId'
    get:
      operationId: consultarPaciente
      tags:
      - Pacientes
      summary: Consultar cadastro mínimo do paciente
      description: Recepção vê o cadastro da unidade. Médico vê o cadastro vinculado ao próprio escopo.
      x-perfis:
      - recepcao
      - medico
      responses:
        '200':
          description: Cadastro encontrado.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacienteDetalhe'
              example:
                id: 00000000-0000-4000-8000-000000000011
                nome: Paciente Exemplo A
                nascimento: '1991-02-03'
        '400':
          $ref: '#/components/responses/EntradaInvalida'
        '401':
          $ref: '#/components/responses/AutenticacaoNecessaria'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /unidades/{unidadeId}/atendimentos:
    parameters:
    - $ref: '#/components/parameters/UnidadeId'
    get:
      operationId: listarAtendimentos
      tags:
      - Atendimentos
      summary: Listar atendimentos
      description: Filtra pela abertura do atendimento. Ordenação por data de abertura e ID decrescentes. Médico recebe
        os próprios atendimentos.
      x-perfis:
      - recepcao
      - gestao
      - administrador
      - financeiro
      - medico
      parameters:
      - $ref: '#/components/parameters/Inicio'
      - $ref: '#/components/parameters/Fim'
      - $ref: '#/components/parameters/ProfissionalFiltro'
      - name: estado
        in: query
        required: false
        description: Estado do atendimento.
        schema:
          $ref: '#/components/schemas/EstadoAtendimento'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Página de resultados no escopo da sessão.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaAtendimento'
              example:
                dados:
                - id: 00000000-0000-4000-8000-000000000041
                  pacienteId: 00000000-0000-4000-8000-000000000011
                  profissionalId: 00000000-0000-4000-8000-000000000021
                  agendamentoId: 00000000-0000-4000-8000-000000000031
                  estado: aberto
                  abertoEm: '2026-11-05T08:00:00-03:00'
                paginacao:
                  proximoCursor: null
                  limite: 25
        '400':
          $ref: '#/components/responses/EntradaInvalida'
        '401':
          $ref: '#/components/responses/AutenticacaoNecessaria'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
    post:
      operationId: abrirAtendimento
      tags:
      - Atendimentos
      summary: Abrir atendimento
      description: Abre atendimento direto ou vinculado a uma reserva. Reserva, paciente e profissional devem pertencer
        à mesma unidade. A mesma reserva só pode abrir um atendimento.
      x-perfis:
      - recepcao
      - gestao
      parameters:
      - $ref: '#/components/parameters/Idempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbrirAtendimento'
            example:
              pacienteId: 00000000-0000-4000-8000-000000000011
              profissionalId: 00000000-0000-4000-8000-000000000021
              agendamentoId: 00000000-0000-4000-8000-000000000031
      responses:
        '201':
          description: Atendimento aberto.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Atendimento'
              example:
                id: 00000000-0000-4000-8000-000000000041
                pacienteId: 00000000-0000-4000-8000-000000000011
                profissionalId: 00000000-0000-4000-8000-000000000021
                agendamentoId: 00000000-0000-4000-8000-000000000031
                estado: aberto
                abertoEm: '2026-11-05T08:00:00-03:00'
        '400':
          $ref: '#/components/responses/EntradaInvalida'
        '401':
          $ref: '#/components/responses/AutenticacaoNecessaria'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '413':
          $ref: '#/components/responses/CorpoMuitoGrande'
        '415':
          $ref: '#/components/responses/FormatoIncompativel'
        '422':
          $ref: '#/components/responses/RegraNegocio'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /unidades/{unidadeId}/atendimentos/{atendimentoId}:
    parameters:
    - $ref: '#/components/parameters/UnidadeId'
    - $ref: '#/components/parameters/AtendimentoId'
    get:
      operationId: consultarAtendimento
      tags:
      - Atendimentos
      summary: Consultar atendimento
      description: Retorna o resumo operacional. Conteúdo clínico e saldo têm operações próprias.
      x-perfis:
      - recepcao
      - gestao
      - administrador
      - financeiro
      - medico
      responses:
        '200':
          description: Atendimento encontrado.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Atendimento'
              example:
                id: 00000000-0000-4000-8000-000000000041
                pacienteId: 00000000-0000-4000-8000-000000000011
                profissionalId: 00000000-0000-4000-8000-000000000021
                agendamentoId: 00000000-0000-4000-8000-000000000031
                estado: aberto
                abertoEm: '2026-11-05T08:00:00-03:00'
        '400':
          $ref: '#/components/responses/EntradaInvalida'
        '401':
          $ref: '#/components/responses/AutenticacaoNecessaria'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /unidades/{unidadeId}/atendimentos/{atendimentoId}/itens:
    parameters:
    - $ref: '#/components/parameters/UnidadeId'
    - $ref: '#/components/parameters/AtendimentoId'
    get:
      operationId: listarItensAtendimento
      tags:
      - Atendimentos
      summary: Listar itens cobrados do atendimento
      description: Retorna itens com o preço cobrado. Ordenação por ID crescente.
      x-perfis:
      - recepcao
      - gestao
      - administrador
      - financeiro
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Página de resultados no escopo da sessão.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaItemAtendimento'
              example:
                dados:
                - id: 00000000-0000-4000-8000-000000000061
                  atendimentoId: 00000000-0000-4000-8000-000000000041
                  procedimentoId: 00000000-0000-4000-8000-000000000051
                  quantidade: 2
                  valorUnitarioCentavos: 10000
                  cobradoCentavos: 20000
                paginacao:
                  proximoCursor: null
                  limite: 25
        '400':
