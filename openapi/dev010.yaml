          $ref: '#/components/responses/EntradaInvalida'
        '401':
          $ref: '#/components/responses/AutenticacaoNecessaria'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '413':
          $ref: '#/components/responses/CorpoMuitoGrande'
        '415':
          $ref: '#/components/responses/FormatoIncompativel'
        '422':
          $ref: '#/components/responses/RegraNegocio'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErroInterno'
components:
  securitySchemes:
    SessaoCookie:
      type: apiKey
      in: cookie
      name: dm-piloto-sessao
      description: Cookie protegido da sessão web. O SDK pode dividi-lo em partes com sufixos numéricos.
    SessaoBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token da sessão validado no servidor. A autorização por unidade e objeto é reavaliada a cada operação.
  parameters:
    UnidadeId:
      name: unidadeId
      in: path
      required: true
      description: Identificador da unidade no escopo do vínculo ativo.
      schema:
        $ref: '#/components/schemas/Identificador'
    AgendamentoId:
      name: agendamentoId
      in: path
      required: true
      description: Identificador do agendamento.
      schema:
        $ref: '#/components/schemas/Identificador'
    PacienteId:
      name: pacienteId
      in: path
      required: true
      description: Identificador do paciente.
      schema:
        $ref: '#/components/schemas/Identificador'
    AtendimentoId:
      name: atendimentoId
      in: path
      required: true
      description: Identificador do atendimento.
      schema:
        $ref: '#/components/schemas/Identificador'
    DocumentoId:
      name: documentoId
      in: path
      required: true
      description: Identificador do documento.
      schema:
        $ref: '#/components/schemas/Identificador'
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor opaco recebido da página anterior.
      schema:
        $ref: '#/components/schemas/Cursor'
    Limite:
      name: limit
      in: query
      required: false
      description: Número máximo de itens da página.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Inicio:
      name: inicio
      in: query
      required: true
      description: Limite inicial inclusivo.
      schema:
        $ref: '#/components/schemas/Instante'
    Fim:
      name: fim
      in: query
      required: true
      description: Limite final exclusivo. A janela deve ser positiva e de até 31 dias.
      schema:
        $ref: '#/components/schemas/Instante'
    ProfissionalFiltro:
      name: profissionalId
      in: query
      required: false
      description: Filtra profissional dentro do escopo de leitura.
      schema:
        $ref: '#/components/schemas/Identificador'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag forte e único retornado para o recurso.
      schema:
        $ref: '#/components/schemas/ETagForte'
    Idempotencia:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID novo para cada intenção de gravação. Reutilizar apenas para tentar a mesma operação.
      schema:
        $ref: '#/components/schemas/Identificador'
  headers:
    CorrelationId:
      description: Identificador opaco da requisição para suporte.
      required: true
      schema:
        $ref: '#/components/schemas/Identificador'
    ETag:
      description: ETag forte da revisão devolvida.
      required: true
      schema:
        $ref: '#/components/schemas/ETagForte'
    Location:
      description: URI relativa do recurso principal criado.
      required: true
      schema:
        type: string
        format: uri-reference
    RetryAfter:
      description: Tempo em segundos antes de tentar novamente.
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    EntradaInvalida:
      description: Entrada inválida
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: urn:clinica-dm:problema:entrada-invalida
            title: Entrada inválida
            status: 400
            codigo: ENTRADA_INVALIDA
            correlacaoId: 00000000-0000-4000-8000-000000000099
    AutenticacaoNecessaria:
      description: Autenticação necessária
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        WWW-Authenticate:
          description: Esquema de autenticação exigido.
          required: true
          schema:
            type: string
          example: Bearer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: urn:clinica-dm:problema:sessao-invalida
            title: Autenticação necessária
            status: 401
            codigo: SESSAO_INVALIDA
            correlacaoId: 00000000-0000-4000-8000-000000000099
    AcessoNegado:
      description: Operação proibida
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: urn:clinica-dm:problema:acesso-negado
            title: Operação proibida
            status: 403
            codigo: ACESSO_NEGADO
            correlacaoId: 00000000-0000-4000-8000-000000000099
    NaoEncontrado:
      description: Recurso não encontrado
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: urn:clinica-dm:problema:recurso-nao-encontrado
            title: Recurso não encontrado
            status: 404
            codigo: RECURSO_NAO_ENCONTRADO
            correlacaoId: 00000000-0000-4000-8000-000000000099
    Conflito:
      description: Conflito na operação
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: urn:clinica-dm:problema:conflito-de-estado
            title: Conflito na operação
            status: 409
            codigo: CONFLITO_DE_ESTADO
            correlacaoId: 00000000-0000-4000-8000-000000000099
    VersaoDesatualizada:
      description: Versão desatualizada
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: urn:clinica-dm:problema:versao-desatualizada
            title: Versão desatualizada
            status: 412
            codigo: VERSAO_DESATUALIZADA
            correlacaoId: 00000000-0000-4000-8000-000000000099
    CorpoMuitoGrande:
      description: Corpo muito grande
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: urn:clinica-dm:problema:corpo-muito-grande
            title: Corpo muito grande
            status: 413
            codigo: CORPO_MUITO_GRANDE
            correlacaoId: 00000000-0000-4000-8000-000000000099
    FormatoIncompativel:
      description: Formato de corpo incompatível
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: urn:clinica-dm:problema:formato-incompativel
            title: Formato de corpo incompatível
            status: 415
            codigo: FORMATO_INCOMPATIVEL
            correlacaoId: 00000000-0000-4000-8000-000000000099
    RegraNegocio:
      description: Regra de negócio não atendida
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: urn:clinica-dm:problema:regra-negocio
            title: Regra de negócio não atendida
            status: 422
            codigo: REGRA_NEGOCIO
            correlacaoId: 00000000-0000-4000-8000-000000000099
    VersaoObrigatoria:
      description: Precondição obrigatória
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: urn:clinica-dm:problema:versao-obrigatoria
            title: Precondição obrigatória
            status: 428
            codigo: VERSAO_OBRIGATORIA
            correlacaoId: 00000000-0000-4000-8000-000000000099
    LimiteExcedido:
      description: Limite de requisições excedido
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: urn:clinica-dm:problema:limite-excedido
            title: Limite de requisições excedido
            status: 429
            codigo: LIMITE_EXCEDIDO
            correlacaoId: 00000000-0000-4000-8000-000000000099
    ErroInterno:
      description: Erro interno
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: urn:clinica-dm:problema:erro-interno
            title: Erro interno
            status: 500
            codigo: ERRO_INTERNO
            correlacaoId: 00000000-0000-4000-8000-000000000099
  schemas:
    AcessoUnidade:
      type: object
      additionalProperties: false
      required: [unidadeId, perfis]
      properties:
        unidadeId:
          $ref: '#/components/schemas/Identificador'
        perfis:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [recepcao, medico, financeiro, gestao, administrador]
    Identificador:
      type: string
      format: uuid
    Instante:
      type: string
      format: date-time
      pattern: (Z|[+-][0-9]{2}:[0-9]{2})$
      description: Data e hora com deslocamento UTC ou Z.
    Data:
      type: string
      format: date
    Centavos:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    CentavosLancamento:
      type: integer
      minimum: 1
      maximum: 2147483647
    SaldoCentavos:
      type: integer
      minimum: -9007199254740991
      maximum: 9007199254740991
    ETagForte:
      type: string
      pattern: ^"[A-Za-z0-9_-]{1,120}"$
    Cursor:
      type: string
      minLength: 1
      maxLength: 1024
    Limite:
      type: integer
      minimum: 1
      maximum: 100
    Paginacao:
      type: object
      additionalProperties: false
      required:
      - proximoCursor
      - limite
      properties:
        proximoCursor:
          anyOf:
          - $ref: '#/components/schemas/Cursor'
          - type: 'null'
        limite:
          $ref: '#/components/schemas/Limite'
    EstadoAgendamento:
      type: string
      enum:
      - reservado
      - confirmado
      - remarcado
      - cancelado
      - realizado
    EstadoAtendimento:
      type: string
      enum:
      - aberto
      - encerrado
      - cancelado
    TipoDocumento:
      type: string
      enum:
      - evolucao_texto
      - evolucao_estruturada
      - evolucao_exames
      - laudo
    EstadoDocumento:
      type: string
      enum:
      - rascunho
      - finalizada
      - em_revisao
      - devolvido_para_correcao
      - aprovado_para_assinatura
      - assinado
      - liberado
    Problema:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - codigo
      - correlacaoId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: integer
          minimum: 400
          maximum: 599
        codigo:
          type: string
          pattern: ^[A-Z][A-Z_]{1,63}$
        correlacaoId:
          $ref: '#/components/schemas/Identificador'
        detail:
          type: string
          minLength: 1
          maxLength: 300
        campos:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required:
            - campo
            - codigo
            properties:
              campo:
                type: string
                minLength: 1
                maxLength: 120
              codigo:
                type: string
                minLength: 1
                maxLength: 64
    CriarAgendamento:
      type: object
      additionalProperties: false
      required:
      - pacienteId
      - profissionalId
      - inicio
      - fim
      properties:
        pacienteId:
          $ref: '#/components/schemas/Identificador'
        profissionalId:
          $ref: '#/components/schemas/Identificador'
        inicio:
          $ref: '#/components/schemas/Instante'
        fim:
          $ref: '#/components/schemas/Instante'
    Agendamento:
      type: object
      additionalProperties: false
      required:
      - id
      - pacienteId
      - profissionalId
      - inicio
      - fim
      - estado
      properties:
        id:
          $ref: '#/components/schemas/Identificador'
        pacienteId:
          $ref: '#/components/schemas/Identificador'
        profissionalId:
          $ref: '#/components/schemas/Identificador'
        inicio:
          $ref: '#/components/schemas/Instante'
        fim:
          $ref: '#/components/schemas/Instante'
        estado:
          $ref: '#/components/schemas/EstadoAgendamento'
    AlterarAgendamento:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - acao
        - inicio
        - fim
        properties:
          acao:
            type: string
            const: remarcar
          inicio:
            $ref: '#/components/schemas/Instante'
          fim:
            $ref: '#/components/schemas/Instante'
      - type: object
        additionalProperties: false
        required:
        - acao
        properties:
          acao:
            type: string
            const: confirmar
      - type: object
        additionalProperties: false
        required:
        - acao
        properties:
          acao:
            type: string
            const: cancelar
    CriarPaciente:
      type: object
      additionalProperties: false
      required:
      - nome
      properties:
        nome:
          type: string
          minLength: 2
          maxLength: 160
        nascimento:
          $ref: '#/components/schemas/Data'
    PacienteResumo:
      type: object
      additionalProperties: false
      required:
      - id
      - nome
      properties:
        id:
          $ref: '#/components/schemas/Identificador'
        nome:
          type: string
          minLength: 2
          maxLength: 160
    PacienteDetalhe:
      type: object
      additionalProperties: false
      required:
      - id
      - nome
      - nascimento
      properties:
        id:
          $ref: '#/components/schemas/Identificador'
        nome:
          type: string
          minLength: 2
          maxLength: 160
        nascimento:
          anyOf:
          - $ref: '#/components/schemas/Data'
          - type: 'null'
    AbrirAtendimento:
      type: object
      additionalProperties: false
      required:
      - pacienteId
      - profissionalId
      properties:
        pacienteId:
          $ref: '#/components/schemas/Identificador'
        profissionalId:
          $ref: '#/components/schemas/Identificador'
        agendamentoId:
          $ref: '#/components/schemas/Identificador'
    Atendimento:
      type: object
      additionalProperties: false
      required:
      - id
      - pacienteId
      - profissionalId
      - agendamentoId
      - estado
      - abertoEm
      properties:
        id:
          $ref: '#/components/schemas/Identificador'
        pacienteId:
          $ref: '#/components/schemas/Identificador'
        profissionalId:
          $ref: '#/components/schemas/Identificador'
        agendamentoId:
          anyOf:
          - $ref: '#/components/schemas/Identificador'
          - type: 'null'
        estado:
          $ref: '#/components/schemas/EstadoAtendimento'
        abertoEm:
          $ref: '#/components/schemas/Instante'
    ProfissionalResumo:
      type: object
      additionalProperties: false
      required:
      - id
      - nome
      - ativo
      properties:
        id:
          $ref: '#/components/schemas/Identificador'
        nome:
          type: string
          minLength: 2
          maxLength: 160
        ativo:
          type: boolean
    Convenio:
      type: object
      additionalProperties: false
      required:
      - id
      - nome
      - ativo
      properties:
        id:
          $ref: '#/components/schemas/Identificador'
        nome:
          type: string
          minLength: 2
          maxLength: 160
        ativo:
          type: boolean
    Procedimento:
      type: object
      additionalProperties: false
      required:
      - id
      - codigo
      - descricao
      - ativo
      properties:
        id:
          $ref: '#/components/schemas/Identificador'
        codigo:
          type: string
          minLength: 1
          maxLength: 80
        descricao:
          type: string
          minLength: 1
          maxLength: 240
        ativo:
          type: boolean
    PrecoProcedimento:
      type: object
      additionalProperties: false
      required:
      - procedimentoId
      - convenioId
      - vigenciaInicio
      - vigenciaFimExclusivo
      - valorCentavos
      properties:
        procedimentoId:
          $ref: '#/components/schemas/Identificador'
        convenioId:
          $ref: '#/components/schemas/Identificador'
        vigenciaInicio:
          $ref: '#/components/schemas/Data'
        vigenciaFimExclusivo:
          anyOf:
          - $ref: '#/components/schemas/Data'
          - type: 'null'
        valorCentavos:
          type: integer
          minimum: 0
          maximum: 2147483647
    AdicionarItem:
      type: object
      additionalProperties: false
      required:
      - procedimentoId
      - convenioId
      - quantidade
      properties:
        procedimentoId:
          $ref: '#/components/schemas/Identificador'
        convenioId:
          $ref: '#/components/schemas/Identificador'
        quantidade:
          type: integer
          minimum: 1
          maximum: 1000
    ItemAtendimento:
      type: object
      additionalProperties: false
      required:
      - id
      - atendimentoId
      - procedimentoId
      - quantidade
      - valorUnitarioCentavos
      - cobradoCentavos
      properties:
        id:
          $ref: '#/components/schemas/Identificador'
        atendimentoId:
          $ref: '#/components/schemas/Identificador'
        procedimentoId:
          $ref: '#/components/schemas/Identificador'
        quantidade:
          type: integer
          minimum: 1
          maximum: 1000
        valorUnitarioCentavos:
          $ref: '#/components/schemas/Centavos'
        cobradoCentavos:
          $ref: '#/components/schemas/Centavos'
    ItemClinico:
      type: object
      additionalProperties: false
      required:
      - id
      - atendimentoId
      - procedimentoId
      - quantidade
      properties:
        id:
          $ref: '#/components/schemas/Identificador'
        atendimentoId:
          $ref: '#/components/schemas/Identificador'
        procedimentoId:
          $ref: '#/components/schemas/Identificador'
        quantidade:
          type: integer
          minimum: 1
          maximum: 1000
    SaldoAtendimento:
      type: object
      additionalProperties: false
      required:
      - atendimentoId
      - cobradoCentavos
      - recebidoLiquidoCentavos
      - saldoCentavos
      - pendenteCentavos
      properties:
        atendimentoId:
          $ref: '#/components/schemas/Identificador'
        cobradoCentavos:
          $ref: '#/components/schemas/Centavos'
        recebidoLiquidoCentavos:
          $ref: '#/components/schemas/Centavos'
        saldoCentavos:
          $ref: '#/components/schemas/SaldoCentavos'
        pendenteCentavos:
          $ref: '#/components/schemas/Centavos'
    Receber:
      type: object
      additionalProperties: false
      required:
      - valorCentavos
      properties:
        valorCentavos:
          $ref: '#/components/schemas/CentavosLancamento'
    Estornar:
      type: object
      additionalProperties: false
      required:
      - movimentoOrigemId
      properties:
        movimentoOrigemId:
          $ref: '#/components/schemas/Identificador'
    Recebimento:
      type: object
      additionalProperties: false
      required:
      - id
      - atendimentoId
      - valorCentavos
      - ocorridoEm
      - tipo
      properties:
        id:
          $ref: '#/components/schemas/Identificador'
        atendimentoId:
          $ref: '#/components/schemas/Identificador'
        valorCentavos:
          $ref: '#/components/schemas/CentavosLancamento'
        ocorridoEm:
          $ref: '#/components/schemas/Instante'
        tipo:
          type: string
          const: recebimento
    Estorno:
      type: object
      additionalProperties: false
      required:
      - id
      - atendimentoId
      - valorCentavos
      - ocorridoEm
      - tipo
      - movimentoOrigemId
      properties:
        id:
          $ref: '#/components/schemas/Identificador'
        atendimentoId:
          $ref: '#/components/schemas/Identificador'
        valorCentavos:
          $ref: '#/components/schemas/CentavosLancamento'
        ocorridoEm:
          $ref: '#/components/schemas/Instante'
        tipo:
          type: string
          const: estorno
        movimentoOrigemId:
          $ref: '#/components/schemas/Identificador'
    ConteudoTexto:
      type: object
      additionalProperties: false
      required:
      - texto
      properties:
        texto:
          type: string
          minLength: 0
          maxLength: 24000
    ConteudoEstruturado:
      type: object
      additionalProperties: false
      required:
      - campos
      properties:
        campos:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
            - chave
            - valor
            properties:
              chave:
                type: string
                minLength: 1
                maxLength: 80
              valor:
                type:
                - string
                - number
                - boolean
                - 'null'
                maxLength: 4000
    ConteudoDocumento:
      oneOf:
      - $ref: '#/components/schemas/ConteudoTexto'
      - $ref: '#/components/schemas/ConteudoEstruturado'
    CriarDocumento:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - tipo
        - itemId
        - conteudo
        properties:
          tipo:
            type: string
            const: laudo
          itemId:
            $ref: '#/components/schemas/Identificador'
          conteudo:
            $ref: '#/components/schemas/ConteudoTexto'
      - type: object
        additionalProperties: false
        required:
        - tipo
        - conteudo
        properties:
          tipo:
            type: string
            const: evolucao_texto
          conteudo:
            $ref: '#/components/schemas/ConteudoTexto'
      - type: object
        additionalProperties: false
        required:
        - tipo
        - conteudo
        properties:
          tipo:
            type: string
            enum:
            - evolucao_estruturada
            - evolucao_exames
          conteudo:
